[package]
name = "cmdtrigger-core"
description = "CmdTrigger agent core: commands, automations, HomeKit, Home Assistant, local API, MCP, server link"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cmdtrigger-protocol = { path = "../cmdtrigger-protocol" }
anyhow = "1"
axum = "0.8"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
base64 = "0.22"
chacha20poly1305 = "0.11"
dirs = "7"
ed25519-dalek = "3"
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
gethostname = "1"
getrandom = "0.4"
hex = "0.4"
hkdf = "0.13"
hmac = "0.13"
mdns-sd = "0.21"
network-interface = "2"
notify = "8"
qrcode = { version = "0.14", default-features = false, features = ["svg"] }
num-bigint = "0.4"
num-traits = "0.2"
reqwest = { version = "0.13.5", default-features = false, features = ["json", "rustls"] }
rumqttc = { version = "0.25", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
sha1 = "0.11"
sha2 = "0.11"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
tokio-util = "0.7"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }
url = "2"
x25519-dalek = { version = "3", features = ["static_secrets"] }

httparse = "1"

[target.'cfg(windows)'.dependencies]
windows-service = "0.8"

[dev-dependencies]
tempfile = "3"
