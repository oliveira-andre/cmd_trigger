[package]
name = "cmdtrigger-server"
description = "Your own CmdTrigger server: a dashboard and API that run commands on your computers from anywhere"
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
cmdtrigger-protocol = { path = "../cmdtrigger-protocol" }
argon2 = "0.5"
axum = { version = "0.8", features = ["ws"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
getrandom = "0.4"
hex = "0.4"
rusqlite = { version = "0.37", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.11"
tokio = { version = "1", features = ["macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["fmt", "env-filter"] }

[dev-dependencies]
cmdtrigger-core = { path = "../cmdtrigger-core" }
reqwest = { version = "0.13.5", default-features = false, features = ["json"] }
tempfile = "3"
