# Builds, checks and tests CmdTrigger on Linux, Windows and macOS, and uploads the installers
# each platform produces (unsigned) as workflow artifacts.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-22.04, windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev librsvg2-dev libayatana-appindicator3-dev patchelf

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - run: npm ci
      - run: npx tsc --noEmit
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # Unit tests everywhere (incl. the cmd.exe runner on Windows), HomeKit end to end
      # everywhere, and the agent ⇄ server end-to-end test on Linux and macOS.
      - run: cargo test --workspace
      - run: npx tauri build

      - name: Headless CLI and server
        run: cargo build --release -p cmdtrigger-cli -p cmdtrigger-server

      - uses: actions/upload-artifact@v4
        with:
          name: cmdtrigger-${{ runner.os }}
          path: |
            target/release/bundle/deb/*.deb
            target/release/bundle/rpm/*.rpm
            target/release/bundle/appimage/*.AppImage
            target/release/bundle/msi/*.msi
            target/release/bundle/nsis/*.exe
            target/release/bundle/dmg/*.dmg
            target/release/cmdtrigger
            target/release/cmdtrigger.exe
            target/release/cmdtrigger-server
            target/release/cmdtrigger-server.exe
          if-no-files-found: error
