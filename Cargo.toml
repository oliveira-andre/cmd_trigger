[workspace]
resolver = "3"
members = ["crates/cmdtrigger-protocol", "crates/cmdtrigger-core", "crates/cmdtrigger-server", "crates/cmdtrigger-cli", "src-tauri"]

[workspace.package]
version = "0.2.0"
edition = "2024"
license = "MIT"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
strip = true

# HomeKit pairing does 3072-bit modular exponentiation; keep debug builds usable.
[profile.dev.package.num-bigint]
opt-level = 3

[profile.dev.package.sha2]
opt-level = 3
